# Builds a standalone (JS bundled, no Metro needed) release APK for testing on a
# phone and publishes it to the rolling "preview" GitHub release:
#   https://github.com/AbedBashir/Su2al/releases/download/preview/su2al-preview.apk
# Signed with the debug keystore: fine for sideloading, NOT for the Play Store
# (production AABs come from EAS in phase 7).
name: Android preview APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-preview-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # Real phones only (ARM); skipping x86 keeps the APK small and the build fast.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon

      - name: Publish to the "preview" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk su2al-preview.apk
          gh release delete preview --yes --cleanup-tag || true
          gh release create preview su2al-preview.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Su2al preview build" \
            --notes "Test build from ${GITHUB_SHA::7}. Download su2al-preview.apk on your Android phone and install it (allow installs from your browser when asked)."
